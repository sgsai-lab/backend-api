name: Deploy (development)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

# Repository/environment variables (Settings → Environments → development):
#   GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA, GCP_RUNTIME_SA,
#   CLOUD_SQL_INSTANCE (project:region:instance), CORS_ALLOW_ORIGINS, FRONTEND_BASE_URL
env:
  SERVICE: backend-api
  MIGRATE_JOB: backend-api-migrate
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/backend/backend-api:${{ github.sha }}
  SECRETS: >-
    DATABASE_URL=DATABASE_URL:latest,JWT_PRIVATE_KEY=JWT_PRIVATE_KEY:latest,MFA_ENCRYPTION_KEY=MFA_ENCRYPTION_KEY:latest,EMAIL_API_KEY=EMAIL_API_KEY:latest,GOOGLE_OAUTH_CLIENT_IDS=GOOGLE_OAUTH_CLIENT_IDS:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Run database migrations (Cloud Run Job)
        run: |
          gcloud run jobs deploy "$MIGRATE_JOB" \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --set-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --set-env-vars "ENVIRONMENT=development,LOG_JSON=true" \
            --command alembic --args upgrade,head \
            --max-retries 0 --task-timeout 300s
          gcloud run jobs execute "$MIGRATE_JOB" --region "${{ vars.GCP_REGION }}" --wait

      - name: Deploy service
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --set-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
            --set-secrets "$SECRETS" \
            --set-env-vars "^@^ENVIRONMENT=development@LOG_JSON=true@GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}@EMAIL_BACKEND=api@FRONTEND_BASE_URL=${{ vars.FRONTEND_BASE_URL }}@CORS_ALLOW_ORIGINS=${{ vars.CORS_ALLOW_ORIGINS }}" \
            --min-instances 0 --max-instances 3 \
            --memory 512Mi --cpu 1 --timeout 60s \
            --allow-unauthenticated

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          curl -fsS --retry 5 --retry-delay 3 "$URL/healthz"
          curl -fsS --retry 5 --retry-delay 3 "$URL/readyz"
          echo "### Deployed \`${{ github.sha }}\` to $URL" >> "$GITHUB_STEP_SUMMARY"
