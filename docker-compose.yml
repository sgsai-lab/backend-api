services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment: &api-env
      ENVIRONMENT: local
      LOG_JSON: "false"
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      FRONTEND_BASE_URL: http://localhost:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # One-shot: applies Alembic migrations before the API starts.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP catcher for verification / reset emails. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
