sonar.projectKey=sgsai-lab_backend-api
sonar.organization=sgsai-lab
sonar.projectName=backend-api

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Generated/vendored data and the thin process entrypoint are not analysed for coverage.
sonar.coverage.exclusions=app/__main__.py,app/templates/**,app/data/**
sonar.cpd.exclusions=migrations/versions/**
